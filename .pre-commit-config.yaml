---
exclude: |
    (?x)(
        ^_extensions/|
        ^_site/|
        ^_freeze/|
        ^renv/|
        ^static/
    )

repos:
  - repo: meta
    hooks:
      - id: identity
      - id: check-hooks-apply
  # Protect secrets using Gitleaks
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.21.1
    hooks:
      - id: gitleaks
  # Supported base hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
  # Add trailing commas to calls and literals.
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma
  # YAML linter
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [--config-file, .github/linters/.yaml-lint.yml]
  # Markdown lint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [-c, .github/linters/.markdown-lint.yml, -f]
        types: [file]
        files: .(md|qmd)$
  # Lint and format Python files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.7.0
    hooks:
      # Run the Ruff formatter.
      - id: ruff-format
        args: [--config=.ruff.toml]
      # # Run the Ruff linter.
      # - id: ruff
      #   args: [--config=.ruff.toml, --exit-non-zero-on-fix]